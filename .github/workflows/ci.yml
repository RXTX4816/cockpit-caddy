name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    uses: RXTX4816/cockpit-plugin-base-react/.github/workflows/ci-plugin.yml@main
    with:
      plugin-name: cockpit-caddy
    secrets: inherit

  # Generated Caddyfiles must load in a real Caddy, not just look right in a string
  # compare. The shared Test job has no caddy binary, so it skips these.
  caddy-adapt:
    name: Caddy adapt
    runs-on: ubuntu-latest
    env:
      CADDY_VERSION: "2.11.7"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - run: npm ci

      - name: Install Caddy
        run: |
          curl -fsSL "https://github.com/caddyserver/caddy/releases/download/v${CADDY_VERSION}/caddy_${CADDY_VERSION}_linux_amd64.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP" caddy
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - run: caddy version

      - name: caddy adapt on generated configs
        run: npx vitest run src/api/caddyAdapt.test.ts
        env:
          CADDY_ADAPT_REQUIRED: "1"

      # The per-site DNS tests need a Caddy with a dns.providers module, which the release
      # tarball lacks. caddyserver.com builds one on request; cache it per version so the
      # (slow) build server is hit once.
      - name: Cache Caddy with cloudflare
        id: caddy-dns-cache
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/caddy-dns
          key: caddy-dns-cloudflare-${{ env.CADDY_VERSION }}

      - name: Download Caddy with cloudflare
        if: steps.caddy-dns-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/caddy-dns"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/caddy-dns/caddy" \
            "https://caddyserver.com/api/download?os=linux&arch=amd64&p=github.com/caddy-dns/cloudflare&version=v${CADDY_VERSION}"
          chmod +x "$RUNNER_TEMP/caddy-dns/caddy"

      - name: caddy adapt with a DNS provider
        run: |
          export PATH="$RUNNER_TEMP/caddy-dns:$PATH"
          caddy list-modules | grep -q '^dns.providers.cloudflare$'
          npx vitest run src/api/siteDns.test.ts
        env:
          CADDY_ADAPT_REQUIRED_DNS: "1"
